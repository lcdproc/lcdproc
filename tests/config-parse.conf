# Input for tests/config-parse.sh: the configuration file syntax that
# LCDd.conf and the client configuration files rely on.

; comments start with '#' or ';'

[Server]
# repeated keys keep every value, in order
Driver=curses
Driver=text
# quoted values keep their spaces and understand C escapes
Hello="  Welcome to"
Hello="   LCDproc!"
Escapes="tab\there, quote\" and backslash\\"
Spaced = "spaces around the = sign"
# a comment after whitespace ends an unquoted value
WaitTime=5   # five seconds
# ... and so does a comment straight after the value
Port=13666;no space before this comment
Bind=127.0.0.1#nor before this one
# a comment where the value would start leaves the value empty
User= # no user
Empty=

# section and key names are case-insensitive, and a repeated section
# carries on where the first left off
[SERVER]
reportlevel=3

[MtxOrb]
Size=20x4

[Shell]
# '#' and ';' inside quotes are part of the value
Exec="echo one; echo two"
Exec2="ls ;echo spaced"
Exec3="grep -c x # not a comment"

[Sizes]
# WIDTHxHEIGHT values, read with config_get_size()
Size=20x4
TooWide=999x4
Zero=0x2
Junk=big
Repeat=16x2
Repeat=40x4
